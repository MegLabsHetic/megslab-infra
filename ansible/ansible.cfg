[defaults]
inventory = inventory/clients.yml
roles_path = roles
host_key_checking = True
interpreter_python = auto_silent
stdout_callback = yaml
# Affiche la difference exacte appliquee a chaque fichier : c'est ce qui rend
# une execution relisible, et ce qui permet `--check --diff` en mode audit.
callbacks_enabled = profile_tasks

[ssh_connection]
pipelining = True
